# cpplint style check (Google C++ style). Run from the repo root:
#   cpplint --recursive cpp
set noparent
linelength=120

# The project is C++17; <filesystem> is a required header.
filter=-build/c++17

# adcs_core is generated by MATLAB Coder; build holds CMake output.
exclude_files=^(adcs_core|build)$
